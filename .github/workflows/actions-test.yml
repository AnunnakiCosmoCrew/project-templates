name: Actions tests

# Unit tests for the composite actions in actions/. Standard library only; runs in seconds.
# PR-triggered so a change to a shared check is verified before any consumer picks it up.

# Runs on every PR (it takes seconds) so it can be a required check: the EmirErs /go reusable
# workflow is called @main by every routine repo, so nothing reaches main here untested.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actions-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actions-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Unit tests (brand-claim-check)
        run: python3 -m unittest discover -s actions/brand-claim-check/tests -v

      - name: Unit tests (a11y-check)
        run: python3 -m unittest discover -s actions/a11y-check/tests -v

      # The EmirErs /go reusable workflow is live in every routine repo the moment it merges
      # (they call it @main), so its guarantees are checked here first; the Claude review
      # workflow's trigger and concurrency rules too, before its copies are rolled out (PT-43).
      # The founder-tier classifier (ADR 0007) is run straight from the review workflow file.
      - name: Unit tests (emirers-go, claude-review and founder-tier)
        run: python3 -m unittest discover -s tests -v

      # The action itself, end to end, against its own fixtures: the fixture tree is
      # built to fail, so a green step here would mean the action stopped checking.
      - name: Composite action fails on the violating fixture
        id: fixture
        uses: ./actions/brand-claim-check
        with:
          rules: actions/brand-claim-check/tests/fixtures/rules.json
        continue-on-error: true

      # Not "any failure": the action must have scanned and counted exactly what the
      # fixtures plant (7 errors, 2 warnings over 10 rules), so a broken script path or a
      # rules-loading error (exit 2, no counts) fails this step too.
      - name: Assert the action failed for the right reason
        env:
          OUTCOME: ${{ steps.fixture.outcome }}
          ERRORS: ${{ steps.fixture.outputs.errors }}
          WARNINGS: ${{ steps.fixture.outputs.warnings }}
          RULES: ${{ steps.fixture.outputs.rules }}
        run: |
          echo "outcome=$OUTCOME errors=$ERRORS warnings=$WARNINGS rules=$RULES"
          [ "$OUTCOME" = "failure" ] && [ "$ERRORS" = "7" ] && [ "$WARNINGS" = "2" ] && [ "$RULES" = "10" ] || {
            echo "::error::brand-claim-check did not report the fixture violations as expected"
            exit 1
          }

      # a11y-check, end to end in a real browser against its own fixtures: one page that must
      # pass, one built to fail (exact count, so a silent no-op cannot pass), one whose two
      # violations are allow-listed with reasons.
      - name: a11y-check passes the clean fixture
        id: a11y_pass
        uses: ./actions/a11y-check
        with:
          root: actions/a11y-check/tests/fixtures/pass

      - name: a11y-check fails the violating fixture
        id: a11y_fail
        uses: ./actions/a11y-check
        with:
          root: actions/a11y-check/tests/fixtures/fail
        continue-on-error: true

      - name: a11y-check passes the allow-listed fixture
        id: a11y_allowed
        uses: ./actions/a11y-check
        with:
          root: actions/a11y-check/tests/fixtures/allowed

      - name: Assert a11y-check results
        env:
          PASS_V: ${{ steps.a11y_pass.outputs.violations }}
          PASS_PAGES: ${{ steps.a11y_pass.outputs.pages }}
          FAIL_OUTCOME: ${{ steps.a11y_fail.outcome }}
          FAIL_V: ${{ steps.a11y_fail.outputs.violations }}
          ALLOWED_V: ${{ steps.a11y_allowed.outputs.violations }}
          ALLOWED_N: ${{ steps.a11y_allowed.outputs.allowed }}
        run: |
          echo "pass: v=$PASS_V pages=$PASS_PAGES | fail: outcome=$FAIL_OUTCOME v=$FAIL_V | allowed: v=$ALLOWED_V n=$ALLOWED_N"
          [ "$PASS_V" = "0" ] && [ "$PASS_PAGES" = "1" ] \
            && [ "$FAIL_OUTCOME" = "failure" ] && [ "$FAIL_V" = "2" ] \
            && [ "$ALLOWED_V" = "0" ] && [ "$ALLOWED_N" = "2" ] || {
            echo "::error::a11y-check did not behave as the fixtures require"
            exit 1
          }
